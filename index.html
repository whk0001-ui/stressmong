<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Relax V3 - Full Height View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #F4F2EE;
            margin: 0; padding: 0; overflow: hidden; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 인트로 화면 스타일 */
        #intro-screen {
            position: fixed; inset: 0; background: #F4F2EE;
            z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; }

        .intro-logo {
            width: 100px; height: 100px; background: #D1E8E2;
            border-radius: 50%; margin-bottom: 1.5rem;
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            animation: float 4s ease-in-out infinite;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        .btn-start {
            padding: 0.8rem 3.5rem; background: #3d3935; color: white;
            border-radius: 100px; font-weight: 700; font-size: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        canvas { touch-action: none; cursor: pointer; display: block; outline: none; }

        /* 메시지 칩 - 인형 위로 덮이게 배치 (위치 가독성 최적화) */
        #comfort-message {
            position: fixed; top: calc(env(safe-area-inset-top) + 85px); left: 50%; transform: translateX(-50%);
            z-index: 50; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0; width: 100%; display: flex; justify-content: center;
        }
        #comfort-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .message-pill {
            font-weight: 700; color: #e11d48;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 24px; border-radius: 100px;
            border: 1px solid rgba(225, 29, 72, 0.12);
            white-space: nowrap; font-size: 13px; max-width: 90vw;
            overflow: hidden; text-overflow: ellipsis;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
        }

        /* 액션 컨트롤 도크 */
        .action-dock {
            position: fixed; top: calc(env(safe-area-inset-top) + 16px); right: 16px; z-index: 100;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px; padding: 3px;
            display: flex; flex-direction: row; gap: 2px;
        }

        .btn-action {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: transparent; color: #666;
            transition: all 0.2s; position: relative;
        }
        .btn-action svg { width: 14px; height: 14px; }

        .recording-dot {
            position: absolute; top: 4px; right: 4px; width: 4px; height: 4px;
            background: #ef4444; border-radius: 50%; display: none;
            animation: pulse 1s infinite;
        }
        .is-recording .recording-dot { display: block; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* 상태바 */
        .status-pill {
            position: fixed; bottom: calc(env(safe-area-inset-bottom) + 20px); left: 20px;
            background: rgba(45, 42, 38, 0.85);
            backdrop-filter: blur(15px);
            padding: 4px 18px; border-radius: 100px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 12px; color: white;
            z-index: 100; pointer-events: none;
        }
        .counter-val { font-weight: 900; font-size: 1.4rem; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }

        /* 설정 사이드바 */
        .sidebar-panel { 
            position: fixed; left: 0; right: 0; bottom: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200; transform: translateY(105%);
            display: flex; justify-content: center;
        }
        .sidebar-panel.active { transform: translateY(0); }
        .sidebar-content {
            background: white; width: 100%; max-width: 450px;
            border-radius: 2.5rem 2.5rem 0 0; padding: 2.2rem;
            box-shadow: 0 -15px 50px rgba(0,0,0,0.1);
        }
        
        @media (orientation: landscape) {
            #comfort-message { top: 15px; }
            .action-dock { top: auto; bottom: 15px; right: 15px; }
            .status-pill { bottom: 15px; left: 15px; }
            .sidebar-panel { left: auto; right: 0; top: 0; bottom: 0; transform: translateX(105%); width: 320px; }
            .sidebar-panel.active { transform: translateX(0); }
            .sidebar-content { border-radius: 2.5rem 0 0 2.5rem; height: 100%; }
        }

        input[type=range] { appearance: none; background: rgba(0,0,0,0.06); height: 4px; border-radius: 10px; width: 100%; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: #3d3935; border-radius: 50%; border: 4px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .ai-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
        .ai-modal.active { display: flex; }
    </style>
</head>
<body>

    <!-- [1] 인트로 화면 -->
    <div id="intro-screen">
        <div class="intro-logo"><span class="text-4xl">🧸</span></div>
        <h1 class="text-xl font-black text-stone-800 mb-1">Pure Relax</h1>
        <p class="text-stone-400 mb-8 text-center text-sm leading-relaxed px-10">오늘도 고생한 당신을 위해,<br/>사이다 같은 위로를 준비했어요.</p>
        <button class="btn-start shadow-xl" onclick="startApp()">시작하기</button>
    </div>

    <!-- [2] 힐링 메시지 -->
    <div id="comfort-message">
        <div class="message-pill font-bold">
            인형을 주물러 보세요...
        </div>
    </div>

    <!-- [3] 액션 컨트롤 도크 -->
    <div class="action-dock" id="main-dock">
        <button class="btn-action" title="업로드" onclick="triggerFileInput()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImage(event)">
        
        <button onclick="toggleRecording()" class="btn-action" id="record-btn" title="녹화">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <div class="recording-dot"></div>
        </button>

        <button onclick="openAI()" class="btn-action" title="AI">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </button>
        
        <button onclick="toggleSidebar()" class="btn-action" title="설정">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        
        <button class="btn-action" onclick="toggleMute()"><span id="sound-icon-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span></button>
    </div>

    <!-- [4] 상태바 -->
    <div class="status-pill">
        <div id="mood-emoji" class="text-2xl drop-shadow-sm transition-all duration-300">😩</div>
        <div class="w-[1px] h-5 bg-white/20"></div>
        <div id="squish-counter" class="counter-val">0</div>
    </div>

    <!-- [5] 설정 사이드바 -->
    <div id="sidebar" class="sidebar-panel">
        <div class="sidebar-content shadow-2xl">
            <div class="w-12 h-1 bg-stone-100 rounded-full mx-auto mb-6"></div>
            <div class="space-y-6">
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between uppercase tracking-widest"><span>확대/축소</span><span id="zoom-val" class="font-mono">1.2x</span></label>
                    <input type="range" id="zoom-slider" min="0.5" max="4" step="0.01" value="1.2">
                </div>
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between uppercase tracking-widest"><span>위치(Y)</span><span id="offset-val" class="font-mono">0</span></label>
                    <input type="range" id="y-offset-slider" min="-800" max="800" step="1" value="0">
                </div>
            </div>
            <button onclick="resetImage()" class="w-full mt-8 py-3 bg-stone-50 text-stone-400 font-bold rounded-xl text-[11px] tracking-widest">초기화</button>
            <button onclick="toggleSidebar()" class="w-full mt-3 py-3 bg-stone-800 text-white font-bold rounded-xl text-[11px] tracking-widest">확인</button>
        </div>
    </div>

    <!-- [6] AI 모달 -->
    <div id="ai-modal" class="ai-modal">
        <div class="ai-content bg-white p-8 rounded-[2rem] w-full max-w-[380px] shadow-2xl">
            <h3 class="text-lg font-black text-stone-800 mb-2">무엇이든 털어놓으세요</h3>
            <textarea id="ai-input" class="w-full h-32 p-4 bg-stone-50 rounded-2xl outline-none mb-6 text-sm" placeholder="오늘 하루는 어땠나요?"></textarea>
            <div class="flex gap-2"><button onclick="closeAI()" class="flex-1 py-4 bg-stone-100 rounded-xl text-xs font-bold text-stone-500">닫기</button><button onclick="getAIHealing()" id="ai-submit" class="flex-[2] py-4 bg-stone-800 text-white font-bold rounded-xl text-xs">위로 받기</button></div>
        </div>
    </div>

    <main id="stage" class="relative w-full h-full flex items-center justify-center">
        <canvas id="mainCanvas"></canvas>
    </main>

    <script>
        const intro = document.getElementById('intro-screen');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const counterEl = document.getElementById('squish-counter');
        const emojiEl = document.getElementById('mood-emoji');
        const messageEl = document.getElementById('comfort-message');
        const sidebar = document.getElementById('sidebar');
        const fileInput = document.getElementById('file-input');
        const zoomSlider = document.getElementById('zoom-slider');
        const yOffsetSlider = document.getElementById('y-offset-slider');
        const aiModal = document.getElementById('ai-modal');
        const aiInput = document.getElementById('ai-input');
        const aiSubmit = document.getElementById('ai-submit');

        let width, height, ballSize;
        let squishCount = 0;
        let isMuted = false;
        let userImg = null;
        let imgZoom = 1.2;
        let imgYOffset = 0;
        let isPopped = false; 

        const meshRes = 18; 
        let mesh = [];
        let cottonParticles = []; 
        let activeTouches = new Map();

        const apiKey = ""; 
        const moodSteps = ['😩','😟','😐','🙂','😊','🥰','🤩'];

        const catharticMessages = [
            "인생 참 엿같다, 그치?", "그 인간 면상이라 생각하고 꽉 눌러!", "지랄도 풍년이라더니 오늘이 딱이네.", "퇴사가 답인가...", "오늘 너 건드린 놈, 대대손손 탈모 와라!",
            "다 때려치우고 싶다 진짜...", "내 통장은 왜 스쳐 지나가는 통로일 뿐인가.", "세상은 넓고 미친놈은 더 많다.", "부장놈 얼굴 여기다 합성하고 싶지?",
            "시X... 소리가 절로 나오네.", "적게 일하고 많이 벌게 해주세요 제발.", "오늘 하루 진짜 고생했어, 이 개 같은 세상에서.", "돈 많은 백수가 꿈입니다.", "인간관계? 다 부질없다 주물러버려!",
            "내일 지구가 멸망했으면 좋겠어.", "월요일이 오지 않게 해주세요.", "개소리를 정성스럽게 하네 그 인간은.", "웃어주니까 가마니로 보인가?", "법만 없었으면 진짜...",
            "복수하고 싶다... 성공으로!", "참는 자에게 복이 오는 게 아니라 병이 온다.", "빡치면 팍팍 눌러, 내가 다 받아줄게.", "인생은 멀리서 보면 희극, 가까이서 보면 비극, 난 지금 지옥.", "오늘 너 건드린 사람, 발가락 문지방에 찧어라!",
            "아... 진짜 욕나오게 하네.", "내가 뭘 그렇게 잘못했다고!", "운전 똑바로 안 하냐 이 멍청아!", "당신의 빡침을 응원합니다.",
            "지랄병은 약도 없다더라.", "말이야 방구야?", "왜 나한테만 그래 진짜!", "지갑도 텅, 마음도 텅.",
            "야! 소리 한번 크게 지르고 싶지?", "인생은 실전이야 꼬마야...", "돈이 최고다 역시.", "당신의 분노는 정당합니다.",
            "다 부숴버리고 싶다!", "잠 좀 자자 인간들아!", "왜 나만 일하는 거 같지?", "공짜로 부려 먹으려고 아주...", "갑질 하는 놈들은 다 천벌 받을 거야.",
            "다이어트는 내일부터, 스트레스는 지금 당장!", "어차피 인생은 마이웨이.", "남의 시선? 엿이나 먹으라 그래.", "손맛 좋지? 그 인간 멱살 대신이야.", "스트레스는 쌓아두면 똥 된다.",
            "오늘은 술 한잔 각이다.", "울어도 돼, 근데 주무르면서 울어.", "인생 노잼 시기... 팍팍 눌러!", "뭐가 문제야 대체!", "답정너는 답이 없다.", "내 인생의 주인공은 난데, 왜 조연 같지?", "행복? 그게 먹는 건가요?", 
            "탈출은 지능 순이라는데 난 왜 여기 있나.", "오늘 하루도 버티느라 수고했어, 대견해.", "이 구역의 미친X은 나야!", "말 걸지 마라 진짜 빡친다.",
            "주물주물, 니 화를 다 가져갈게.", "인형이 터질 때까지 화풀이해!", "기분이 태도가 되지 말자는데, 기분이 쓰레기인걸 어떡해!", "착하게 살면 손해 보는 세상.", "수고했어, 오늘도. 진심으로."
        ];

        function startApp() { initAudio(); intro.classList.add('hidden'); updateMessage("인형이 당신의 빡침(?)을 기다렸어요!"); }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let audioUnlocked = false;

        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            if (!audioUnlocked) {
                const b = audioCtx.createBuffer(1, 1, 22050);
                const s = audioCtx.createBufferSource(); s.buffer = b; s.connect(audioCtx.destination); s.start(0);
                audioUnlocked = true;
            }
        }

        function playCheerfulRustle() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1200 + Math.random() * 400, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.1);

            const grainCount = 5;
            for(let i=0; i<grainCount; i++) {
                const st = now + (i * 0.01); const dur = 0.02 + Math.random() * 0.03;
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
                const data = buffer.getChannelData(0); for(let k=0; k<data.length; k++) data[k] = Math.random() * 2 - 1;
                const s = audioCtx.createBufferSource(); s.buffer = buffer;
                const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.setValueAtTime(3200 + Math.random()*2000, st);
                const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.012, st); g2.gain.exponentialRampToValueAtTime(0.001, st + dur);
                s.connect(f); f.connect(g2); g2.connect(audioCtx.destination); s.start(st);
            }
        }

        function playPopSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.5);
        }

        class Cotton {
            constructor(x, y) {
                this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 16; this.vy = (Math.random() - 1.1) * 20;
                this.size = Math.random() * 15 + 20; this.alpha = 1.0; this.angle = Math.random() * Math.PI * 2; this.rot = (Math.random() - 0.5) * 0.1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.4; this.vx *= 0.97; this.vy *= 0.97; this.alpha -= 0.006; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = 'white';
                for(let i=0; i<3; i++) { const ox = Math.cos(i*2.1)*(this.size/2.5); const oy = Math.sin(i*2.1)*(this.size/2.5); ctx.beginPath(); ctx.arc(ox, oy, this.size/2, 0, Math.PI*2); ctx.fill(); }
                ctx.restore();
            }
        }

        function triggerPop() {
            isPopped = true; playPopSound(); const cx = width / 2; const cy = height / 2;
            for(let i=0; i<50; i++) cottonParticles.push(new Cotton(cx, cy));
            updateMessage("앗! 치료가 필요해요! 금방 고쳐줄게요 ✨", true);
            setTimeout(() => { isPopped = false; squishCount = 0; counterEl.innerText = "0"; emojiEl.innerText = moodSteps[0]; updateMessage("다시 주물러보세요!", true); }, 4000);
        }

        function checkInDoll(x, y) {
            const dx = Math.abs(x - width / 2);
            const dy = Math.abs(y - (height / 2 + imgYOffset * (ballSize/800)));
            // 히트박스 판정을 인형의 실제 화면상 세로 크기에 맞춰 동적 조절
            const hitW = ballSize * 0.48;
            const hitH = (ballSize * 0.48) / dollAspect;
            return dx < hitW && dy < hitH;
        }

        function triggerFileInput() { fileInput.click(); }
        function handleImage(e) { 
            const file = e.target.files[0]; 
            if (file) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => { const img = new Image(); img.onload = () => { userImg = img; resize(); }; img.src = ev.target.result; }; 
                reader.readAsDataURL(file); 
            } 
        }

        const handleInteractionStart = (id, x, y) => {
            if (isPopped) return;
            initAudio();
            if (checkInDoll(x, y)) {
                if (!userImg) { triggerFileInput(); return; }
                activeTouches.set(id, { x, y });
                squishCount++; counterEl.innerText = squishCount.toLocaleString();
                const stepIdx = Math.min(Math.floor(squishCount / 14.3), 6);
                if (emojiEl.innerText !== moodSteps[stepIdx]) { emojiEl.innerText = moodSteps[stepIdx]; emojiEl.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 250 }); }
                if (squishCount >= 100) triggerPop();
                else { playCheerfulRustle(); updateMessage(); }
            }
        };

        const handleInteractionMove = (id, x, y) => { if (activeTouches.has(id)) activeTouches.set(id, { x, y }); };
        const handleInteractionEnd = (id) => activeTouches.delete(id);

        canvas.addEventListener('mousedown', (e) => handleInteractionStart('mouse', e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleInteractionMove('mouse', e.clientX, e.clientY));
        window.addEventListener('mouseup', () => handleInteractionEnd('mouse'));
        canvas.addEventListener('click', (e) => { if (!userImg && checkInDoll(e.clientX, e.clientY)) triggerFileInput(); });
        canvas.addEventListener('touchstart', (e) => { 
            if (e.cancelable) e.preventDefault(); 
            const t = e.changedTouches[0];
            if (!userImg && checkInDoll(t.clientX, t.clientY)) { triggerFileInput(); return; }
            for (let i = 0; i < e.changedTouches.length; i++) handleInteractionStart(e.changedTouches[i].identifier, e.changedTouches[i].clientX, e.changedTouches[i].clientY); 
        }, { passive: false });
        window.addEventListener('touchmove', (e) => { for (let i = 0; i < e.changedTouches.length; i++) handleInteractionMove(e.changedTouches[i].identifier, e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, { passive: true });
        window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) handleInteractionEnd(e.changedTouches[i].identifier); });

        let lastIdx = -1;
        function updateMessage(forceTxt) {
            let nextIdx;
            do { nextIdx = Math.floor(Math.random() * catharticMessages.length); } while (nextIdx === lastIdx);
            lastIdx = nextIdx;
            messageEl.classList.remove('show');
            setTimeout(() => {
                const displayTxt = forceTxt || catharticMessages[nextIdx];
                messageEl.children[0].innerText = displayTxt;
                messageEl.classList.add('show');
                if (!forceTxt) { setTimeout(() => { if (messageEl.children[0].innerText === displayTxt) messageEl.classList.remove('show'); }, 3000); }
            }, 50);
        }

        let dollAspect = 1;
        function resize() {
            width = window.innerWidth; height = window.innerHeight; 
            canvas.width = width * devicePixelRatio; canvas.height = height * devicePixelRatio; 
            canvas.style.width = width+'px'; canvas.style.height = height+'px'; 
            ctx.scale(devicePixelRatio, devicePixelRatio); 
            
            // 핵심 개선: 이미지 비율에 맞춰 화면 높이를 넘지 않도록 크기 결정
            if (userImg) {
                dollAspect = userImg.width / userImg.height;
                const maxWidthSize = width * 0.95; // 너비 기준 최대 크기
                const maxHeightSize = (height * 0.82) * dollAspect; // 높이 기준 최대 크기 (82% 확보)
                ballSize = Math.min(maxWidthSize, maxHeightSize);
            } else {
                ballSize = Math.min(width, height) * 0.85;
            }
            initMesh();
        }
        function initMesh() { mesh = []; for (let r = 0; r <= meshRes; r++) for (let c = 0; c <= meshRes; c++) mesh.push({ ox: c/meshRes-0.5, oy: r/meshRes-0.5, cx: c/meshRes-0.5, cy: r/meshRes-0.5, vx: 0, vy: 0 }); }
        window.addEventListener('resize', resize); resize();

        function updatePhysics() {
            const cx = width/2, cy = height/2, maxD = 0.15;
            mesh.forEach(p => {
                p.vx += (p.ox - p.cx) * 0.22; p.vy += (p.oy - p.cy) * 0.22;
                activeTouches.forEach(pos => { 
                    const tx = (pos.x - cx)/ballSize; 
                    const ty = (pos.y - cy)/(ballSize / dollAspect); 
                    const d = Math.sqrt((p.cx-tx)**2 + (p.cy-ty)**2); 
                    if (d < 0.25) { const s = (0.25-d)*2.2; p.vx += (tx-p.cx)*s*0.45; p.vy += (ty-p.cy)*s*0.45; } 
                });
                p.vx *= 0.82; p.vy *= 0.82; p.cx += p.vx; p.cy += p.vy;
                const d = Math.sqrt((p.cx-p.ox)**2 + (p.cy-p.oy)**2); if (d > maxD) { const r = maxD/d; p.cx = p.ox + (p.cx-p.ox)*r; p.cy = p.oy + (p.cy-p.oy)*r; }
            });
            cottonParticles = cottonParticles.filter(c => c.alpha > 0); cottonParticles.forEach(c => c.update());
        }

        function drawTriangle(img, x0, y0, x1, y1, x2, y2, sx0, sy0, sx1, sy1, sx2, sy2) {
            ctx.save(); ctx.beginPath(); const cX = (x0+x1+x2)/3, cY = (y0+y1+y2)/3, fix = 1.3; ctx.moveTo(x0+(x0-cX)*(fix/100), y0+(y0-cY)*(fix/100)); ctx.lineTo(x1+(x1-cX)*(fix/100), y1+(y1-cY)*(fix/100)); ctx.lineTo(x2+(x2-cX)*(fix/100), y2+(y2-cY)*(fix/100)); ctx.closePath(); ctx.clip();
            const denom = sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1); if (Math.abs(denom) < 0.1) { ctx.restore(); return; }
            const m11 = (x0*(sy1-sy2)+x1*(sy2-sy0)+x2*(sy0-sy1))/denom, m12 = (y0*(sy1-sy2)+y1*(sy2-sy0)+y2*(sy0-sy1))/denom, m21 = (x0*(sx2-sx1)+x1*(sx0-sx2)+x2*(sx1-sx0))/denom, m22 = (y0*(sx2-sx1)+y1*(sx0-sx2)+y2*(sx1-sx0))/denom, dx = (x0*(sx1*sy2-sx2*sy1)+x1*(sx2*sy0-sx0*sy2)+x2*(sx0*sy1-sx1*sy0))/denom, dy = (y0*(sx1*sy2-sx2*sy1)+y1*(sx2*sy0-sx0*sy2)+y2*(sx0*sy1-sx1*sy0))/denom;
            ctx.setTransform(m11*devicePixelRatio, m12*devicePixelRatio, m21*devicePixelRatio, m22*devicePixelRatio, dx*devicePixelRatio, dy*devicePixelRatio); ctx.drawImage(img, 0, 0); ctx.restore();
        }

        function render() {
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, width, height); updatePhysics();
            const cx = width / 2, cy = height / 2, s = ballSize;
            if (userImg && !isPopped) {
                for (let r = 0; r < meshRes; r++) { 
                    for (let c = 0; c < meshRes; c++) { 
                        const i0 = r*(meshRes+1)+c, i1 = i0+1, i2 = i0+(meshRes+1), i3 = i2+1; 
                        const p0 = mesh[i0], p1 = mesh[i1], p2 = mesh[i2], p3 = mesh[i3]; 
                        const getSX = (p) => (p.ox + 0.5) * userImg.width / imgZoom + (userImg.width * (1 - 1/imgZoom) / 2); 
                        const getSY = (p) => (p.oy + 0.5) * userImg.height / imgZoom + (userImg.height * (1 - 1/imgZoom) / 2) - imgYOffset/imgZoom; 
                        drawTriangle(userImg, cx + p0.cx*s, cy + p0.cy*(s/dollAspect), cx + p1.cx*s, cy + p1.cy*(s/dollAspect), cx + p2.cx*s, cy + p2.cy*(s/dollAspect), getSX(p0), getSY(p0), getSX(p1), getSY(p1), getSX(p2), getSY(p2)); 
                        drawTriangle(userImg, cx + p1.cx*s, cy + p1.cy*(s/dollAspect), cx + p3.cx*s, cy + p3.cy*(s/dollAspect), cx + p2.cx*s, cy + p2.cy*(s/dollAspect), getSX(p1), getSY(p1), getSX(p3), getSY(p3), getSX(p2), getSY(p2)); 
                    } 
                }
                activeTouches.forEach(pos => { const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, ballSize*0.2); g.addColorStop(0, 'rgba(0,0,0,0.04)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fill(); });
            } else if (!userImg && !isPopped) { 
                ctx.beginPath(); ctx.arc(cx, cy, ballSize/3.5, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill(); 
                ctx.strokeStyle = '#DDD'; ctx.setLineDash([8, 8]); ctx.stroke(); ctx.fillStyle = '#BBB'; ctx.font = 'bold 12px Pretendard'; ctx.textAlign = 'center'; 
                ctx.fillText('자신만의 인형을 올려보세요', cx, cy + 5); 
            }
            cottonParticles.forEach(c => c.draw()); requestAnimationFrame(render);
        }
        render();

        function toggleSidebar() { sidebar.classList.toggle('active'); }
        zoomSlider.oninput = (e) => { imgZoom = parseFloat(e.target.value); document.getElementById('zoom-val').innerText = imgZoom.toFixed(1) + "x"; };
        yOffsetSlider.oninput = (e) => { imgYOffset = parseInt(e.target.value); document.getElementById('offset-val').innerText = imgYOffset; };
        function resetImage() { imgZoom = 1.2; imgYOffset = 0; zoomSlider.value = 1.2; yOffsetSlider.value = 0; document.getElementById('zoom-val').innerText = "1.2x"; document.getElementById('offset-val').innerText = "0"; }
        function toggleMute() { isMuted = !isMuted; document.getElementById('sound-icon-svg').innerHTML = isMuted ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'; };
        
        let mediaRecorder, chunks = [];
        function toggleRecording() { 
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                chunks = []; const stream = canvas.captureStream(30); mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = `relax-${Date.now()}.webm`; a.click(); };
                mediaRecorder.start(); document.body.classList.add('is-recording'); updateMessage("녹화 중...", true);
            } else { mediaRecorder.stop(); document.body.classList.remove('is-recording'); updateMessage("저장 완료!", true); }
        }

        function openAI() { initAudio(); aiModal.classList.add('active'); aiInput.focus(); }
        function closeAI() { aiModal.classList.remove('active'); }
        async function getAIHealing() {
            const input = aiInput.value.trim(); if (!input) return; aiSubmit.disabled = true; aiSubmit.innerHTML = '<span class="loader"></span>';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: `고민: "${input}"` }] }], systemInstruction: { parts: [{ text: "당신은 아주 솔직하고 사이다 같은 위로를 건네는 인형 친구입니다. 가끔은 같이 욕도 해주고 속 시원한 한두 문장만 말해주세요." }] } };
            let text = "괜찮아요, 제가 곁에 있을게요.";
            try { const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); const json = await res.json(); text = json.candidates?.[0]?.content?.parts?.[0]?.text || text; } catch(e){}
            aiSubmit.disabled = false; aiSubmit.innerHTML = '위로 받기'; aiInput.value = ''; closeAI(); updateMessage(text);
            if (!isMuted) {
                const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                const ttsP = { contents: [{ parts: [{ text: `Say warmly: ${text}` }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } }, model: "gemini-2.5-flash-preview-tts" };
                try { const r = await fetch(ttsUrl, { method:'POST', body: JSON.stringify(ttsP)}); const j = await r.json(); new Audio(URL.createObjectURL(pcmToWav(j.candidates[0].content.parts[0].inlineData.data, 24000))).play(); } catch(e){}
            }
        }
        function pcmToWav(b64, rate) { const bin = atob(b64), len = bin.length, bytes = new Int16Array(len / 2); for (let i = 0; i < len / 2; i++) bytes[i] = (bin.charCodeAt(i * 2) | (binary.charCodeAt(i * 2 + 1) << 8)); const buf = new ArrayBuffer(44 + bytes.length * 2), view = new DataView(buf); const write = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }; write(0,'RIFF'); view.setUint32(4, 36 + bytes.length * 2, true); write(8, 'WAVE'); write(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, bytes.length * 2, true); for (let i = 0; i < bytes.length; i++) view.setInt16(44 + i * 2, bytes[i], true); return new Blob([buf], {type:'audio/wav'}); }
    </script>
