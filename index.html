<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Relax V3 - Full Screen Landscape Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #F4F2EE;
            margin: 0; padding: 0; overflow: hidden; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 인트로 화면 스타일 */
        #intro-screen {
            position: fixed; inset: 0; background: #F4F2EE;
            z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; }

        .intro-logo {
            width: 120px; height: 120px; background: #D1E8E2;
            border-radius: 50%; margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            animation: float 4s ease-in-out infinite;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .intro-logo::after { content: '✨'; position: absolute; top: -10px; right: -10px; font-size: 1.5rem; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .btn-start {
            padding: 1rem 3.5rem; background: #3d3935; color: white;
            border-radius: 100px; font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .btn-start:hover { transform: scale(1.05); background: #000; }
        .btn-start:active { transform: scale(0.95); }

        /* 메인 앱 요소 */
        canvas { touch-action: none; cursor: pointer; display: block; }

        #comfort-message {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            z-index: 50; pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
        }
        #comfort-message.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        /* 액션 컨트롤 도크 */
        .action-dock {
            position: fixed; top: 12px; right: 12px; z-index: 100;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px; padding: 3px;
            display: flex; flex-direction: row; gap: 2px;
        }

        /* 가로 모드 시 도크 위치 조정 (방해 최소화) */
        @media (orientation: landscape) {
            .action-dock { top: auto; bottom: 12px; right: 12px; }
        }

        .btn-action {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 11px; background: transparent; color: #777;
            transition: all 0.3s; position: relative;
        }
        .btn-action:hover { background: rgba(255,255,255,0.5); color: #000; }
        .btn-action svg { width: 15px; height: 15px; }

        .recording-dot {
            position: absolute; top: 3px; right: 3px; width: 5px; height: 5px;
            background: #ef4444; border-radius: 50%; display: none;
            animation: pulse 1s infinite;
        }
        .is-recording .recording-dot { display: block; }

        /* 다이내믹 상태바 */
        .status-pill {
            background: rgba(45, 42, 38, 0.9);
            backdrop-filter: blur(15px); padding: 6px 24px; border-radius: 100px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 14px; color: white;
            pointer-events: none;
        }

        /* 가로 모드 시 상태바 위치 조정 */
        @media (orientation: landscape) {
            .status-container { bottom: 12px !important; left: 12px !important; transform: none !important; width: auto !important; padding: 0 !important; }
        }

        /* 설정 사이드바 - 모바일 기본 숨김 강화 */
        .sidebar-panel { 
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200; transform: translateY(100%); /* 기본 아래로 숨김 */
        }
        .sidebar-panel.active { transform: translateY(0); }
        
        @media (min-width: 769px) {
            .sidebar-panel { left: 2rem; top: 50%; width: 280px; transform: translate(-120%, -50%); }
            .sidebar-panel.active { transform: translate(0, -50%); }
        }

        input[type=range] { appearance: none; background: rgba(0,0,0,0.06); height: 4px; border-radius: 10px; width: 100%; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: #3d3935; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .ai-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.1); backdrop-filter: blur(8px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
        .ai-modal.active { display: flex; }
    </style>
</head>
<body>

    <!-- [1] 인트로 화면 -->
    <div id="intro-screen">
        <div class="intro-logo">
            <div class="w-16 h-16 bg-white/40 rounded-full blur-xl animate-pulse"></div>
            <span class="text-4xl absolute">🧸</span>
        </div>
        <h1 class="text-2xl font-black text-stone-800 mb-2">Pure Relax</h1>
        <p class="text-stone-400 mb-10 text-center px-8 leading-relaxed">
            지친 마음을 말랑하게 녹여줄게요.<br/>당신만의 인형을 만나보세요.
        </p>
        <button class="btn-start" onclick="startApp()">시작하기</button>
        <p class="mt-6 text-[10px] text-stone-300 font-bold uppercase tracking-widest">v3.2 Landscape Pro</p>
    </div>

    <!-- [2] 메인 앱 영역 -->
    <div id="comfort-message">
        <div class="font-bold text-stone-600 bg-white/70 backdrop-blur-md py-2 px-6 rounded-full border border-white/80 shadow-sm inline-block text-sm">
            인형을 주물러 보세요...
        </div>
    </div>

    <!-- 액션 컨트롤 도크 -->
    <div class="action-dock" id="main-dock">
        <button id="upload-btn-real" class="btn-action" title="사진 업로드" onclick="triggerFileInput()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImage(event)">
        
        <button onclick="toggleRecording()" class="btn-action" id="record-btn" title="영상 녹화">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <div class="recording-dot"></div>
        </button>

        <button onclick="openAI()" class="btn-action" title="AI 상담">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </button>
        
        <button onclick="toggleSidebar()" class="btn-action" title="설정">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        
        <button id="sound-toggle" class="btn-action" onclick="toggleMute()">
            <span id="sound-icon-svg">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </span>
        </button>
    </div>

    <!-- 설정 사이드바 -->
    <div id="sidebar" class="fixed sidebar-panel w-full">
        <div class="sidebar-content bg-white/95 backdrop-blur-3xl p-8 rounded-[3rem] border border-white/70 flex flex-col gap-6 shadow-2xl m-4">
            <span class="text-[11px] font-black text-stone-800 uppercase tracking-widest text-center">Settings</span>
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-stone-400 flex justify-between uppercase"><span>Zoom</span><span id="zoom-val">1.2x</span></label>
                    <input type="range" id="zoom-slider" min="0.5" max="4" step="0.01" value="1.2">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-stone-400 flex justify-between uppercase"><span>Position Y</span><span id="offset-val">0</span></label>
                    <input type="range" id="y-offset-slider" min="-800" max="800" step="1" value="0">
                </div>
            </div>
            <button onclick="resetImage()" class="w-full py-3 bg-stone-50 text-stone-400 font-bold rounded-xl text-[10px] tracking-widest">RESET ALL</button>
        </div>
    </div>

    <!-- AI 모달 -->
    <div id="ai-modal" class="ai-modal">
        <div class="ai-content bg-white p-8 rounded-[2rem] w-full max-w-[380px] shadow-2xl">
            <h3 class="text-xl font-black text-stone-800 mb-2">무엇이든 털어놓으세요</h3>
            <textarea id="ai-input" class="w-full h-32 p-4 bg-stone-50 rounded-2xl outline-none mb-6" placeholder="오늘 하루는 어땠나요?"></textarea>
            <div class="flex gap-2"><button onclick="closeAI()" class="flex-1 py-4 bg-stone-100 rounded-xl text-xs font-bold">닫기</button><button onclick="getAIHealing()" id="ai-submit" class="flex-[2] py-4 bg-stone-800 text-white font-bold rounded-xl text-xs">위로 받기</button></div>
        </div>
    </div>

    <main id="stage" class="relative w-full h-full flex items-center justify-center">
        <canvas id="mainCanvas"></canvas>
    </main>

    <!-- 하단 상태 -->
    <div class="fixed bottom-10 flex flex-col items-center z-50 w-full px-12 pointer-events-none status-container">
        <div class="status-pill">
            <div id="mood-emoji" class="text-3xl drop-shadow-sm transition-all duration-300">😩</div>
            <div class="w-[1px] h-6 bg-white/20"></div>
            <div id="squish-counter" class="counter-val">0</div>
        </div>
    </div>

    <script>
        const intro = document.getElementById('intro-screen');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const counterEl = document.getElementById('squish-counter');
        const emojiEl = document.getElementById('mood-emoji');
        const messageEl = document.getElementById('comfort-message');
        const sidebar = document.getElementById('sidebar');
        const fileInput = document.getElementById('file-input');
        const zoomSlider = document.getElementById('zoom-slider');
        const yOffsetSlider = document.getElementById('y-offset-slider');
        const aiModal = document.getElementById('ai-modal');
        const aiInput = document.getElementById('ai-input');
        const aiSubmit = document.getElementById('ai-submit');

        let width, height, ballSize;
        let squishCount = 0;
        let isMuted = false;
        let userImg = null;
        let imgZoom = 1.2;
        let imgYOffset = 0;
        let isPopped = false; 

        const meshRes = 18; 
        let mesh = [];
        let cottonParticles = []; 
        let activeTouches = new Map();

        const apiKey = ""; 
        const moodSteps = ['😩','😟','😐','🙂','😊','🥰','🤩'];

        // --- 앱 시작 ---
        function startApp() {
            initAudio(); 
            intro.classList.add('hidden');
            setTimeout(() => updateMessage("인형이 당신을 기다렸어요!"), 1000);
        }

        // --- 사운드 엔진 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let audioUnlocked = false;

        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            if (!audioUnlocked) {
                const b = audioCtx.createBuffer(1, 1, 22050);
                const s = audioCtx.createBufferSource(); s.buffer = b; s.connect(audioCtx.destination); s.start(0);
                audioUnlocked = true;
            }
        }

        function playCheerfulRustle() {
            if (isMuted || !audioCtx) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1100 + Math.random() * 400, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            g.gain.setValueAtTime(0.06, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.1);

            const grainCount = 5;
            for(let i=0; i<grainCount; i++) {
                const st = now + (i * 0.012); const dur = 0.02 + Math.random() * 0.03;
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
                const data = buffer.getChannelData(0); for(let k=0; k<data.length; k++) data[k] = Math.random() * 2 - 1;
                const s = audioCtx.createBufferSource(); s.buffer = buffer;
                const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.setValueAtTime(3000 + Math.random()*2000, st);
                const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.015, st); g2.gain.exponentialRampToValueAtTime(0.001, st + dur);
                s.connect(f); f.connect(g2); g2.connect(audioCtx.destination); s.start(st);
            }
        }

        function playPopSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.5);
        }

        class Cotton {
            constructor(x, y) {
                this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 15; this.vy = (Math.random() - 1.1) * 18;
                this.size = Math.random() * 15 + 25; this.alpha = 1.0; this.angle = Math.random() * Math.PI * 2; this.rot = (Math.random() - 0.5) * 0.1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.35; this.vx *= 0.97; this.vy *= 0.97; this.alpha -= 0.005; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = 'white';
                for(let i=0; i<4; i++) { const ox = Math.cos(i*1.5)*(this.size/3); const oy = Math.sin(i*1.5)*(this.size/3); ctx.beginPath(); ctx.arc(ox, oy, this.size/2, 0, Math.PI*2); ctx.fill(); }
                ctx.restore();
            }
        }

        function triggerPop() {
            isPopped = true; playPopSound(); const cx = width / 2; const cy = height / 2;
            for(let i=0; i<60; i++) cottonParticles.push(new Cotton(cx, cy));
            updateMessage("앗! 치료가 필요해요! 금방 고쳐줄게요 ✨");
            setTimeout(() => { isPopped = false; squishCount = 0; counterEl.innerText = "0"; emojiEl.innerText = moodSteps[0]; updateMessage("다시 주물러보세요!"); }, 4000);
        }

        // --- 히트박스 체크 ---
        function checkInDoll(x, y) {
            const dx = x - width / 2;
            const dy = y - (height / 2 + imgYOffset * (ballSize/800));
            return Math.sqrt(dx*dx + dy*dy) < ballSize * 0.45;
        }

        // --- 인터랙션 로직 ---
        function triggerFileInput() { fileInput.click(); }
        function handleImage(e) { 
            const file = e.target.files[0]; 
            if (file) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => { const img = new Image(); img.onload = () => { userImg = img; }; img.src = ev.target.result; }; 
                reader.readAsDataURL(file); 
            } 
        }

        const handleInteractionStart = (id, x, y) => {
            if (isPopped) return;
            initAudio();

            // 인형 영역 내 터치 시
            if (checkInDoll(x, y)) {
                if (!userImg) {
                    triggerFileInput(); // 사진 없으면 업로드
                    return;
                }
                activeTouches.set(id, { x, y });
                squishCount++; counterEl.innerText = squishCount.toLocaleString();
                const stepIdx = Math.min(Math.floor(squishCount / 14.3), 6);
                if (emojiEl.innerText !== moodSteps[stepIdx]) { emojiEl.innerText = moodSteps[stepIdx]; emojiEl.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 250 }); }
                if (squishCount >= 100) triggerPop();
                else { playCheerfulRustle(); if(squishCount % 15 === 0) updateMessage(); }
            }
        };

        const handleInteractionMove = (id, x, y) => { if (activeTouches.has(id)) activeTouches.set(id, { x, y }); };
        const handleInteractionEnd = (id) => activeTouches.delete(id);

        canvas.addEventListener('mousedown', (e) => handleInteractionStart('mouse', e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleInteractionMove('mouse', e.clientX, e.clientY));
        window.addEventListener('mouseup', () => handleInteractionEnd('mouse'));
        // 캔버스 자체 클릭 이벤트 추가 (모바일 업로드 대응)
        canvas.addEventListener('click', (e) => {
             if (!userImg && checkInDoll(e.clientX, e.clientY)) triggerFileInput();
        });
        canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); for (let i = 0; i < e.changedTouches.length; i++) handleInteractionStart(e.changedTouches[i].identifier, e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, { passive: false });
        window.addEventListener('touchmove', (e) => { for (let i = 0; i < e.changedTouches.length; i++) handleInteractionMove(e.changedTouches[i].identifier, e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, { passive: true });
        window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) handleInteractionEnd(e.changedTouches[i].identifier); });

        const msgs = ["당신은 소중해요.", "잠시 숨을 골라보세요.", "오늘 하루도 잘 버텼어요.", "모두 다 잘 될 거예요.", "걱정은 인형에 담아버려요."];
        function updateMessage(txt) {
            messageEl.classList.remove('show');
            setTimeout(() => {
                const displayTxt = txt || msgs[Math.floor(Math.random()*msgs.length)];
                messageEl.children[0].innerText = displayTxt;
                messageEl.classList.add('show');
                setTimeout(() => { if (messageEl.children[0].innerText === displayTxt && !txt) messageEl.classList.remove('show'); }, 5000);
            }, 300);
        }

        // --- 렌더링 루프 및 반응형 리사이즈 ---
        function initMesh() {
            mesh = []; for (let r = 0; r <= meshRes; r++) for (let c = 0; c <= meshRes; c++) mesh.push({ ox: c/meshRes-0.5, oy: r/meshRes-0.5, cx: c/meshRes-0.5, cy: r/meshRes-0.5, vx: 0, vy: 0 });
        }
        
        function resize() {
            width = window.innerWidth; 
            height = window.innerHeight; 
            canvas.width = width * devicePixelRatio; 
            canvas.height = height * devicePixelRatio; 
            canvas.style.width = width+'px'; 
            canvas.style.height = height+'px'; 
            ctx.scale(devicePixelRatio, devicePixelRatio); 
            
            // 가로 모드일 때 인형이 화면에 더 크게 차도록 조정
            if (width > height) {
                ballSize = height * 0.95; // 가로 모드 시 세로 높이에 가깝게 확대
            } else {
                ballSize = width * 0.95; // 세로 모드 시 가로폭에 맞춤
            }
            initMesh();
        }
        window.addEventListener('resize', resize); 
        window.addEventListener('orientationchange', resize);
        resize();

        function updatePhysics() {
            const cx = width/2, cy = height/2, maxD = 0.12;
            mesh.forEach(p => {
                p.vx += (p.ox - p.cx) * 0.22; p.vy += (p.oy - p.cy) * 0.22;
                activeTouches.forEach(pos => { const tx = (pos.x - cx)/ballSize, ty = (pos.y - cy)/ballSize; const d = Math.sqrt((p.cx-tx)**2 + (p.cy-ty)**2); if (d < 0.25) { const s = (0.25-d)*2.2; p.vx += (tx-p.cx)*s*0.45; p.vy += (ty-p.cy)*s*0.45; } });
                p.vx *= 0.82; p.vy *= 0.82; p.cx += p.vx; p.cy += p.vy;
                const d = Math.sqrt((p.cx-p.ox)**2 + (p.cy-p.oy)**2); if (d > maxD) { const r = maxD/d; p.cx = p.ox + (p.cx-p.ox)*r; p.cy = p.oy + (p.cy-p.oy)*r; }
            });
            cottonParticles = cottonParticles.filter(c => c.alpha > 0); cottonParticles.forEach(c => c.update());
        }

        function drawTriangle(img, x0, y0, x1, y1, x2, y2, sx0, sy0, sx1, sy1, sx2, sy2) {
            ctx.save(); ctx.beginPath(); const cX = (x0+x1+x2)/3, cY = (y0+y1+y2)/3, fix = 1.3; ctx.moveTo(x0+(x0-cX)*(fix/100), y0+(y0-cY)*(fix/100)); ctx.lineTo(x1+(x1-cX)*(fix/100), y1+(y1-cY)*(fix/100)); ctx.lineTo(x2+(x2-cX)*(fix/100), y2+(y2-cY)*(fix/100)); ctx.closePath(); ctx.clip();
            const denom = sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1); if (Math.abs(denom) < 0.1) { ctx.restore(); return; }
            const m11 = (x0*(sy1-sy2)+x1*(sy2-sy0)+x2*(sy0-sy1))/denom, m12 = (y0*(sy1-sy2)+y1*(sy2-sy0)+y2*(sy0-sy1))/denom, m21 = (x0*(sx2-sx1)+x1*(sx0-sx2)+x2*(sx1-sx0))/denom, m22 = (y0*(sx2-sx1)+y1*(sx0-sx2)+y2*(sx1-sx0))/denom, dx = (x0*(sx1*sy2-sx2*sy1)+x1*(sx2*sy0-sx0*sy2)+x2*(sx0*sy1-sx1*sy0))/denom, dy = (y0*(sx1*sy2-sx2*sy1)+y1*(sx2*sy0-sx0*sy2)+y2*(sx0*sy1-sx1*sy0))/denom;
            ctx.setTransform(m11*devicePixelRatio, m12*devicePixelRatio, m21*devicePixelRatio, m22*devicePixelRatio, dx*devicePixelRatio, dy*devicePixelRatio); ctx.drawImage(img, 0, 0); ctx.restore();
        }

        function render() {
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, width, height); updatePhysics();
            if (userImg && !isPopped) {
                const cx = width / 2, cy = height / 2, s = ballSize;
                for (let r = 0; r < meshRes; r++) { for (let c = 0; c < meshRes; c++) { const i0 = r*(meshRes+1)+c, i1 = i0+1, i2 = i0+(meshRes+1), i3 = i2+1; const p0 = mesh[i0], p1 = mesh[i1], p2 = mesh[i2], p3 = mesh[i3]; const getSX = (p) => (p.ox + 0.5) * userImg.width / imgZoom + (userImg.width * (1 - 1/imgZoom) / 2); const getSY = (p) => (p.oy + 0.5) * userImg.height / imgZoom + (userImg.height * (1 - 1/imgZoom) / 2) - imgYOffset/imgZoom; drawTriangle(userImg, cx + p0.cx*s, cy + p0.cy*s, cx + p1.cx*s, cy + p1.cy*s, cx + p2.cx*s, cy + p2.cy*s, getSX(p0), getSY(p0), getSX(p1), getSY(p1), getSX(p2), getSY(p2)); drawTriangle(userImg, cx + p1.cx*s, cy + p1.cy*s, cx + p3.cx*s, cy + p3.cy*s, cx + p2.cx*s, cy + p2.cy*s, getSX(p1), getSY(p1), getSX(p3), getSY(p3), getSX(p2), getSY(p2)); } }
                activeTouches.forEach(pos => { const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, ballSize*0.2); g.addColorStop(0, 'rgba(0,0,0,0.04)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fill(); });
            } else if (!userImg && !isPopped) { 
                ctx.beginPath(); ctx.arc(width/2, height/2, ballSize/3.5, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill(); 
                ctx.strokeStyle = '#DDD'; ctx.setLineDash([10, 10]); ctx.stroke(); ctx.fillStyle = '#BBB'; ctx.font = 'bold 13px Pretendard'; ctx.textAlign = 'center'; 
                ctx.fillText('자신만의 인형을 올려보세요', width/2, height/2 + 5); 
            }
            cottonParticles.forEach(c => c.draw()); requestAnimationFrame(render);
        }
        render();

        function toggleSidebar() { sidebar.classList.toggle('active'); }
        zoomSlider.oninput = (e) => { imgZoom = parseFloat(e.target.value); document.getElementById('zoom-val').innerText = imgZoom.toFixed(1) + "x"; };
        yOffsetSlider.oninput = (e) => { imgYOffset = parseInt(e.target.value); document.getElementById('offset-val').innerText = imgYOffset; };
        function resetImage() { imgZoom = 1.2; imgYOffset = 0; zoomSlider.value = 1.2; yOffsetSlider.value = 0; document.getElementById('zoom-val').innerText = "1.2x"; document.getElementById('offset-val').innerText = "0"; }
        function toggleMute() { isMuted = !isMuted; document.getElementById('sound-icon-svg').innerHTML = isMuted ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'; };
        
        let mediaRecorder, chunks = [];
        function toggleRecording() { 
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                chunks = []; const stream = canvas.captureStream(30); mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = `relax-${Date.now()}.webm`; a.click(); };
                mediaRecorder.start(); document.body.classList.add('is-recording'); updateMessage("녹화 중...");
            } else { mediaRecorder.stop(); document.body.classList.remove('is-recording'); updateMessage("저장 완료!"); }
        }

        function openAI() { initAudio(); aiModal.classList.add('active'); aiInput.focus(); }
        function closeAI() { aiModal.classList.remove('active'); }
        async function getAIHealing() {
            const input = aiInput.value.trim(); if (!input) return; aiSubmit.disabled = true; aiSubmit.innerHTML = '<span class="loader"></span>';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: `고민: "${input}"` }] }], systemInstruction: { parts: [{ text: "당신은 따뜻한 위로를 건네는 인형 친구입니다. 아주 부드럽고 다정한 말투로 한두 문장만 말해주세요." }] } };
            let text = "괜찮아요, 제가 곁에 있을게요.";
            try { const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); const json = await res.json(); text = json.candidates?.[0]?.content?.parts?.[0]?.text || text; } catch(e){}
            aiSubmit.disabled = false; aiSubmit.innerHTML = '위로 받기'; aiInput.value = ''; closeAI(); updateMessage(text);
            if (!isMuted) {
                const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                const ttsP = { contents: [{ parts: [{ text: `Say warmly: ${text}` }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } }, model: "gemini-2.5-flash-preview-tts" };
                try { const r = await fetch(ttsUrl, { method:'POST', body: JSON.stringify(ttsP)}); const j = await r.json(); new Audio(URL.createObjectURL(pcmToWav(j.candidates[0].content.parts[0].inlineData.data, 24000))).play(); } catch(e){}
            }
        }
        function pcmToWav(b64, rate) { const bin = atob(b64), len = bin.length, bytes = new Int16Array(len/2); for (let i = 0; i < len / 2; i++) bytes[i] = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)); const buf = new ArrayBuffer(44 + bytes.length * 2), view = new DataView(buf); const write = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }; write(0,'RIFF'); view.setUint32(4, 36 + bytes.length * 2, true); write(8, 'WAVE'); write(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, bytes.length * 2, true); for (let i = 0; i < bytes.length; i++) view.setInt16(44 + i * 2, bytes[i], true); return new Blob([buf], {type:'audio/wav'}); }
