<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Relax V3 - Final Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #F4F2EE;
            margin: 0; padding: 0; overflow: hidden; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        canvas { 
            touch-action: none; 
            cursor: pointer;
            display: block;
        }

        .message-fade { 
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            pointer-events: none;
        }
        
        .sidebar-panel { 
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 70;
            transform: translateY(100%);
        }
        
        @media (max-width: 768px) {
            .sidebar-panel {
                left: 0 !important; top: auto !important; bottom: 0 !important;
                width: 100% !important;
            }
            .sidebar-panel.active { transform: translateY(0); }
            .sidebar-content {
                border-radius: 3.5rem 3.5rem 0 0 !important;
                padding-bottom: env(safe-area-inset-bottom, 32px) !important;
                box-shadow: 0 -20px 80px rgba(0,0,0,0.06);
            }
        }

        @media (min-width: 769px) {
            .sidebar-panel {
                left: 2rem; top: 50%; width: 300px;
                transform: translate(-120%, -50%);
            }
            .sidebar-panel.active { transform: translate(0, -50%); }
        }

        input[type=range] { 
            appearance: none; background: rgba(0,0,0,0.06); height: 6px; border-radius: 10px; width: 100%;
        }
        input[type=range]::-webkit-slider-thumb { 
            appearance: none; width: 22px; height: 22px; background: #3d3935; border-radius: 50%; cursor: pointer; 
            border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .action-dock {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            flex-direction: row;
            gap: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.02);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-action {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; background: transparent; color: #888;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }
        .btn-action:hover { background: rgba(255,255,255,0.7); color: #000; transform: scale(1.05); }
        .btn-action:active { transform: scale(0.9); }
        .btn-action svg { width: 16px; height: 16px; }

        .recording-indicator {
            position: absolute; top: 4px; right: 4px;
            width: 6px; height: 6px; background: #ef4444;
            border-radius: 50%; display: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .is-recording .recording-indicator { display: block; }
        .is-recording .action-dock { background: rgba(255, 255, 255, 0.15); border-color: rgba(239, 68, 68, 0.3); }

        .status-pill {
            background: rgba(45, 42, 38, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 28px; border-radius: 100px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            display: flex; align-items: center; gap: 16px; color: white;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .counter-val {
            font-weight: 900; font-size: 2rem;
            letter-spacing: -0.05em; font-variant-numeric: tabular-nums;
        }

        .ai-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.05);
            backdrop-filter: blur(12px); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .ai-modal.active { display: flex; }
        .ai-content {
            background: white; width: 100%; max-width: 420px; border-radius: 40px;
            padding: 36px; box-shadow: 0 30px 80px rgba(0,0,0,0.1);
            animation: jellyPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes jellyPop {
            from { transform: scale(0.6) translateY(60px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .loader {
            width: 20px; height: 20px;
            border: 3px solid #F4F2EE; border-bottom-color: #2D2A26;
            border-radius: 50%; display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="fixed top-16 w-full text-center px-8 z-50">
        <div id="comfort-message" class="message-fade opacity-0 transform translate-y-2 text-xs md:text-sm font-bold text-stone-500 inline-block bg-white/30 backdrop-blur-md py-2 px-8 rounded-full border border-white/50 shadow-sm max-w-[90vw] leading-tight">
            인형을 주물러 보세요...
        </div>
    </div>

    <div class="fixed top-4 right-4 z-[100] action-dock" id="main-dock">
        <button id="upload-btn" class="btn-action" title="사진 업로드">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*" class="hidden">
        
        <button onclick="toggleRecording()" class="btn-action" id="record-btn" title="영상 녹화">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <div class="recording-indicator"></div>
        </button>

        <button onclick="openAI()" class="btn-action" title="AI 상담">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </button>
        
        <button onclick="toggleSidebar()" class="btn-action" title="설정">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        
        <button id="sound-toggle" class="btn-action" title="소리 켜기/끄기">
            <span id="sound-icon-svg">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </span>
        </button>
    </div>

    <div id="sidebar" class="fixed sidebar-panel">
        <div class="sidebar-content bg-white/95 backdrop-blur-3xl p-10 md:p-12 rounded-[4rem] border border-white/70 flex flex-col gap-8 w-full shadow-2xl">
            <div class="md:hidden w-16 h-1.5 bg-stone-100 rounded-full mx-auto -mt-6 mb-4"></div>
            <div class="space-y-4">
                <span class="text-[13px] font-black text-stone-800 uppercase tracking-[0.3em]">Adjustment</span>
                <div class="h-[1.5px] bg-stone-50 w-full mt-2"></div>
            </div>
            <div class="flex flex-col gap-8">
                <div class="space-y-4">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between px-1 uppercase tracking-widest">
                        <span>Scale</span>
                        <span id="zoom-val" class="text-stone-800 font-mono">1.2x</span>
                    </label>
                    <input type="range" id="zoom-slider" min="0.5" max="4" step="0.01" value="1.2">
                </div>
                <div class="space-y-4">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between px-1 uppercase tracking-widest">
                        <span>Position</span>
                        <span id="offset-val" class="text-stone-800 font-mono">0</span>
                    </label>
                    <input type="range" id="y-offset-slider" min="-800" max="800" step="1" value="0">
                </div>
            </div>
            <button onclick="resetImage()" class="w-full py-4 bg-stone-50 text-stone-400 font-bold rounded-2xl hover:bg-rose-50 hover:text-rose-500 transition-all uppercase text-[11px] tracking-widest">Reset</button>
        </div>
    </div>

    <div id="ai-modal" class="ai-modal">
        <div class="ai-content">
            <h3 class="text-2xl font-black text-stone-800 mb-2">당신에게 필요한 위로</h3>
            <p class="text-stone-400 text-sm mb-8 leading-relaxed font-medium">오늘 하루는 어땠나요? <br/>마음 속 이야기를 들려주세요.</p>
            <textarea id="ai-input" class="w-full h-44 p-6 bg-stone-50 border border-stone-100 rounded-[2rem] text-stone-700 text-lg focus:ring-8 focus:ring-stone-50 transition-all outline-none resize-none mb-8" placeholder="무엇이든 털어놓아 보세요..."></textarea>
            <div class="flex gap-4">
                <button onclick="closeAI()" class="flex-1 py-5 bg-stone-100 text-stone-500 font-bold rounded-2xl hover:bg-stone-200 transition-all text-sm uppercase">Close</button>
                <button id="ai-submit" onclick="getAIHealing()" class="flex-[2] py-5 bg-stone-800 text-white font-bold rounded-2xl hover:bg-stone-700 transition-all shadow-lg flex items-center justify-center gap-2 text-sm uppercase">Get Comfort</button>
            </div>
        </div>
    </div>

    <main id="stage" class="relative w-full h-full flex items-center justify-center">
        <canvas id="mainCanvas"></canvas>
    </main>

    <div class="fixed bottom-12 text-center pointer-events-none flex flex-col items-center z-50 w-full px-12">
        <div class="status-pill">
            <div id="mood-emoji" class="text-4xl drop-shadow-sm transition-all duration-300">😩</div>
            <div class="w-[1.5px] h-8 bg-white/20 rounded-full"></div>
            <div id="squish-counter" class="counter-val">0</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const counterEl = document.getElementById('squish-counter');
        const emojiEl = document.getElementById('mood-emoji');
        const messageEl = document.getElementById('comfort-message');
        const soundIconSvg = document.getElementById('sound-icon-svg');
        const fileInput = document.getElementById('file-input');
        const sidebar = document.getElementById('sidebar');
        const zoomSlider = document.getElementById('zoom-slider');
        const yOffsetSlider = document.getElementById('y-offset-slider');
        const aiModal = document.getElementById('ai-modal');
        const aiInput = document.getElementById('ai-input');
        const aiSubmit = document.getElementById('ai-submit');

        let width, height, ballSize;
        let squishCount = 0;
        let isMuted = false;
        let userImg = null;
        let imgZoom = 1.2;
        let imgYOffset = 0;
        let isPopped = false; 

        const meshRes = 20; 
        let mesh = [];
        let cottonParticles = []; 
        let activeTouches = new Map();

        const apiKey = ""; // 여기에 Gemini API 키 입력
        
        const healingMessages = [
            "오늘 하루도 정말 고생 많았어요.", "당신은 충분히 잘해내고 있습니다.", "괜찮아요, 다 잘 될 거예요.", "숨을 크게 한 번 들이마셔 볼까요?", "당신의 속도대로 걸어가도 괜찮아요.",
            "잠시 쉬어가도 세상은 멈추지 않아요.", "오늘의 당신을 진심으로 응원합니다.", "지친 마음이 이 손길로 치유되길.", "당신은 세상에서 가장 소중한 보물입니다.", "행복은 아주 가까운 곳에 있어요."
        ];

        const moodSteps = ['😩','😟','😐','🙂','😊','🥰','🤩'];

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function toggleRecording() { if (!isRecording) startRecording(); else stopRecording(); }
        function startRecording() {
            recordedChunks = [];
            const stream = canvas.captureStream(30); 
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = exportRecording;
            mediaRecorder.start();
            isRecording = true;
            document.body.classList.add('is-recording');
            messageEl.innerText = "녹화 중... 예쁜 순간을 담아보세요! 📹";
            messageEl.style.opacity = '1';
        }
        function stopRecording() {
            mediaRecorder.stop(); isRecording = false;
            document.body.classList.remove('is-recording');
            messageEl.innerText = "녹화 완료! 영상이 저장되었습니다. ✨";
            setTimeout(() => { messageEl.style.opacity = '0'; }, 3000);
        }
        function exportRecording() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `pure-relax-${Date.now()}.webm`; a.click();
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let audioUnlocked = false;

        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            if (!audioUnlocked) {
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer; source.connect(audioCtx.destination); source.start(0);
                audioUnlocked = true;
            }
        }

        function playRealisticRustle() {
            if (isMuted || !audioCtx) return;
            initAudio(); 
            const now = audioCtx.currentTime;
            const grainCount = 4 + Math.floor(Math.random() * 3);
            for(let i=0; i<grainCount; i++) {
                const startOffset = i * 0.015 + Math.random() * 0.02;
                const bSize = audioCtx.sampleRate * 0.04;
                const b = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
                const d = b.getChannelData(0);
                for(let k=0; k<bSize; k++) d[k] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = b;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2500 + Math.random() * 2000, now + startOffset);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.03 + Math.random() * 0.02, now + startOffset);
                gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + 0.04);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now + startOffset);
                const pop = audioCtx.createOscillator(); const popG = audioCtx.createGain();
                pop.type = 'sine'; pop.frequency.setValueAtTime(200 + Math.random() * 100, now + startOffset);
                pop.frequency.exponentialRampToValueAtTime(40, now + startOffset + 0.1);
                popG.gain.setValueAtTime(0.02, now + startOffset); popG.gain.exponentialRampToValueAtTime(0.001, now + startOffset + 0.1);
                pop.connect(popG); popG.connect(audioCtx.destination); pop.start(now + startOffset); pop.stop(now + startOffset + 0.1);
            }
        }

        function playPopSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);
            gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.5);
        }

        class Cotton {
            constructor(x, y) {
                this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 16; this.vy = (Math.random() - 1.2) * 20;
                this.size = Math.random() * 20 + 30; this.alpha = 1.0; this.angle = Math.random() * Math.PI * 2; this.rot = (Math.random() - 0.5) * 0.12;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.4; this.vx *= 0.97; this.vy *= 0.97; this.angle += this.rot; this.alpha -= 0.004; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = 'white';
                for(let i=0; i<5; i++) {
                    const ox = Math.cos(i*1.2) * (this.size/2.5); const oy = Math.sin(i*1.2) * (this.size/2.5);
                    ctx.beginPath(); ctx.arc(ox, oy, this.size/2, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        function triggerPop() {
            isPopped = true; playPopSound(); const cx = width / 2; const cy = height / 2;
            for(let i=0; i<70; i++) cottonParticles.push(new Cotton(cx, cy));
            messageEl.innerText = "앗! 너무 세게 주물렀나 봐요! 금방 고쳐줄게요 ✨"; messageEl.style.opacity = '1';
            setTimeout(() => { isPopped = false; squishCount = 0; counterEl.innerText = "0"; emojiEl.innerText = moodSteps[0]; messageEl.style.opacity = '0'; }, 4000);
        }

        function initMesh() {
            mesh = []; for (let r = 0; r <= meshRes; r++) { for (let c = 0; c <= meshRes; c++) { const x = (c / meshRes) - 0.5; const y = (r / meshRes) - 0.5; mesh.push({ ox: x, oy: y, cx: x, cy: y, vx: 0, vy: 0 }); } }
        }

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio; canvas.height = height * window.devicePixelRatio;
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio); ballSize = Math.min(width * 0.95, height * 0.65); initMesh();
        }
        window.addEventListener('resize', resize); resize();

        function toggleSidebar() { sidebar.classList.toggle('active'); }
        document.getElementById('upload-btn').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = () => { userImg = img; updateComfortMessage(); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }
        };

        zoomSlider.oninput = (e) => { imgZoom = parseFloat(e.target.value); document.getElementById('zoom-val').innerText = imgZoom.toFixed(1) + "x"; };
        yOffsetSlider.oninput = (e) => { imgYOffset = parseInt(e.target.value); document.getElementById('offset-val').innerText = imgYOffset; };
        function resetImage() { imgZoom = 1.2; imgYOffset = 0; zoomSlider.value = 1.2; yOffsetSlider.value = 0; document.getElementById('zoom-val').innerText = "1.2x"; document.getElementById('offset-val').innerText = "0"; }

        function updateComfortMessage() {
            const msg = healingMessages[Math.floor(Math.random() * healingMessages.length)];
            messageEl.style.opacity = '0'; setTimeout(() => { messageEl.innerText = msg; messageEl.style.opacity = '1'; setTimeout(() => { if (messageEl.innerText === msg) messageEl.style.opacity = '0'; }, 5000); }, 400);
        }

        const handleInteractionStart = (id, x, y) => {
            if (isPopped) return;
            initAudio(); activeTouches.set(id, { x, y }); squishCount++; counterEl.innerText = squishCount.toLocaleString();
            const stepIdx = Math.min(Math.floor(squishCount / 14), 6);
            if (emojiEl.innerText !== moodSteps[stepIdx]) { emojiEl.innerText = moodSteps[stepIdx]; emojiEl.animate([{ transform: 'scale(1.6) rotate(15deg)' }, { transform: 'scale(1) rotate(0deg)' }], { duration: 400, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }); }
            if (squishCount >= 100) triggerPop(); else { playRealisticRustle(); if(squishCount % 15 === 0) updateComfortMessage(); }
        };

        canvas.addEventListener('mousedown', (e) => handleInteractionStart('mouse', e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => { if (activeTouches.has('mouse')) activeTouches.set('mouse', { x: e.clientX, y: e.clientY }); });
        window.addEventListener('mouseup', () => activeTouches.delete('mouse'));

        window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) activeTouches.delete(e.changedTouches[i].identifier); });

        document.getElementById('sound-toggle').onclick = () => {

        };

        function updatePhysics() {
            const centerX = width / 2, centerY = height / 2, maxDeform = 0.12; 
            mesh.forEach(p => {
                p.vx += (p.ox - p.cx) * 0.22; p.vy += (p.oy - p.cy) * 0.22;
                activeTouches.forEach((pos) => { const tx = (pos.x - centerX) / ballSize, ty = (pos.y - centerY) / ballSize; const dist = Math.sqrt((p.cx - tx)**2 + (p.cy - ty)**2); if (dist < 0.25) { const s = (0.25 - dist) * 2.2; p.vx += (tx - p.cx) * s * 0.45; p.vy += (ty - p.cy) * s * 0.45; } });
                p.vx *= 0.82; p.vy *= 0.82; p.cx += p.vx; p.cy += p.vy;
                const currentDist = Math.sqrt((p.cx - p.ox)**2 + (p.cy - p.oy)**2); if (currentDist > maxDeform) { const ratio = maxDeform / currentDist; p.cx = p.ox + (p.cx - p.ox) * ratio; p.cy = p.oy + (p.cy - p.oy) * ratio; }
            });

        }

        function drawTriangle(img, x0, y0, x1, y1, x2, y2, sx0, sy0, sx1, sy1, sx2, sy2) {
            ctx.save(); ctx.beginPath(); const cX = (x0 + x1 + x2) / 3, cY = (y0 + y1 + y2) / 3, gapFix = 1.3; 
            ctx.moveTo(x0 + (x0 - cX) * (gapFix / 100), y0 + (y0 - cY) * (gapFix / 100)); ctx.lineTo(x1 + (x1 - cX) * (gapFix / 100), y1 + (y1 - cY) * (gapFix / 100)); ctx.lineTo(x2 + (x2 - cX) * (gapFix / 100), y2 + (y2 - cY) * (gapFix / 100)); ctx.closePath(); ctx.clip();
            const denom = sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1); if (Math.abs(denom) < 0.1) { ctx.restore(); return; }
            const m11 = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom; const m12 = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom; const m21 = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom; const m22 = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom; const dx = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom; const dy = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;
            ctx.setTransform(m11 * window.devicePixelRatio, m12 * window.devicePixelRatio, m21 * window.devicePixelRatio, m22 * window.devicePixelRatio, dx * window.devicePixelRatio, dy * window.devicePixelRatio); ctx.drawImage(img, 0, 0); ctx.restore();
        }

        function render() {
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0); ctx.clearRect(0, 0, width, height); updatePhysics();
            if (userImg && !isPopped) {
                const cx = width / 2, cy = height / 2, s = ballSize;
                for (let r = 0; r < meshRes; r++) { for (let c = 0; c < meshRes; c++) { const i0 = r * (meshRes + 1) + c, i1 = i0 + 1, i2 = i0 + (meshRes + 1), i3 = i2 + 1; const p0 = mesh[i0], p1 = mesh[i1], p2 = mesh[i2], p3 = mesh[i3]; const getSX = (p) => (p.ox + 0.5) * userImg.width / imgZoom + (userImg.width * (1 - 1/imgZoom) / 2); const getSY = (p) => (p.oy + 0.5) * userImg.height / imgZoom + (userImg.height * (1 - 1/imgZoom) / 2) - imgYOffset/imgZoom; drawTriangle(userImg, cx + p0.cx*s, cy + p0.cy*s, cx + p1.cx*s, cy + p1.cy*s, cx + p2.cx*s, cy + p2.cy*s, getSX(p0), getSY(p0), getSX(p1), getSY(p1), getSX(p2), getSY(p2)); drawTriangle(userImg, cx + p1.cx*s, cy + p1.cy*s, cx + p3.cx*s, cy + p3.cy*s, cx + p2.cx*s, cy + p2.cy*s, getSX(p1), getSY(p1), getSX(p3), getSY(p3), getSX(p2), getSY(p2)); } }
                activeTouches.forEach((pos) => { const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, ballSize * 0.2); g.addColorStop(0, 'rgba(0,0,0,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fill(); });
            } else if (!userImg && !isPopped) { ctx.beginPath(); ctx.arc(width/2, height/2, ballSize/3.5, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#EEE'; ctx.setLineDash([10, 10]); ctx.stroke(); ctx.fillStyle = '#CCC'; ctx.font = 'bold 12px Pretendard'; ctx.textAlign = 'center'; ctx.fillText('UPLOAD PHOTO', width/2, height/2 + 5); }
            cottonParticles.forEach(c => c.draw()); requestAnimationFrame(render);
        }
        render();

        function openAI() { initAudio(); aiModal.classList.add('active'); aiInput.focus(); }
        function closeAI() { aiModal.classList.remove('active'); }

        function pcmToWav(base64Pcm, sampleRate) { const binary = atob(base64Pcm); const len = binary.length; const bytes = new Int16Array(len / 2); for (let i = 0; i < len / 2; i++) { bytes[i] = (binary.charCodeAt(i * 2) | (binary.charCodeAt(i * 2 + 1) << 8)); } const buffer = new ArrayBuffer(44 + bytes.length * 2); const view = new DataView(buffer); const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); }; writeString(0, 'RIFF'); view.setUint32(4, 36 + bytes.length * 2, true); writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data'); view.setUint32(40, bytes.length * 2, true); for (let i = 0; i < bytes.length; i++) view.setInt16(44 + i * 2, bytes[i], true); return new Blob([buffer], { type: 'audio/wav' }); }
