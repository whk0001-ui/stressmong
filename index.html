<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Relax V3 - 100 Pop & Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #F4F2EE;
            margin: 0; padding: 0; overflow: hidden; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 인트로 화면 */
        #intro-screen {
            position: fixed; inset: 0; background: #F4F2EE;
            z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; }

        .btn-start {
            padding: 0.8rem 4rem; background: #3d3935; color: white;
            border-radius: 100px; font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        canvas { touch-action: none; cursor: pointer; display: block; outline: none; }

        /* 메시지 칩 - 상단 한 줄 고정 */
        #comfort-message {
            position: fixed; top: calc(env(safe-area-inset-top) + 75px); left: 50%; transform: translateX(-50%);
            z-index: 50; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0; width: 100%; display: flex; justify-content: center;
        }
        #comfort-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .message-pill {
            font-weight: 700; color: #e11d48;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 26px; border-radius: 100px;
            border: 1px solid rgba(225, 29, 72, 0.1);
            white-space: nowrap; font-size: 13px; max-width: 88vw;
            overflow: hidden; text-overflow: ellipsis;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* 액션 컨트롤 도크 */
        .action-dock {
            position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 12px; z-index: 100;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px; padding: 2px;
            display: flex; flex-direction: row; gap: 1px;
        }

        .btn-action {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: transparent; color: #666;
            transition: all 0.2s; position: relative;
        }
        .btn-action svg { width: 14px; height: 14px; }
        .music-active-status { color: #f43f5e; }

        /* 음악 정보 라벨 */
        #bgm-status-box {
            position: fixed; top: calc(env(safe-area-inset-top) + 48px); right: 12px;
            background: rgba(45, 42, 38, 0.85); color: white;
            padding: 4px 12px; border-radius: 8px; font-size: 9px; font-weight: 900;
            text-transform: uppercase; tracking-wider; opacity: 0;
            transition: opacity 0.5s; z-index: 90; pointer-events: none;
        }

        /* 하단 상태바 */
        .status-pill {
            position: fixed; bottom: calc(env(safe-area-inset-bottom) + 15px); left: 15px;
            background: rgba(45, 42, 38, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 4px 20px; border-radius: 100px;
            display: flex; align-items: center; gap: 12px; color: white;
            z-index: 100; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .counter-val { font-weight: 900; font-size: 1.4rem; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }

        /* 설정 사이드바 */
        .sidebar-panel { 
            position: fixed; left: 0; right: 0; bottom: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200; transform: translateY(105%);
            display: flex; justify-content: center;
        }
        .sidebar-panel.active { transform: translateY(0); }
        .sidebar-content {
            background: white; width: 100%; max-width: 450px;
            border-radius: 2.5rem 2.5rem 0 0; padding: 2.2rem;
            box-shadow: 0 -15px 50px rgba(0,0,0,0.1);
        }
        
        input[type=range] { appearance: none; background: rgba(0,0,0,0.06); height: 4px; border-radius: 10px; width: 100%; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: #3d3935; border-radius: 50%; border: 4px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="intro-logo text-5xl">🧸</div>
        <h1 class="text-xl font-black text-stone-800 mb-1">Pure Relax</h1>
        <p class="text-stone-400 mb-8 text-center text-sm leading-relaxed px-10">100번 주무르면 터져요!<br/>새 사진을 넣으면 카운트가 초기화됩니다.</p>
        <button class="btn-start shadow-xl" onclick="startApp()">시작하기</button>
    </div>

    <div id="comfort-message">
        <div class="message-pill font-bold">인형을 주물러 보세요...</div>
    </div>

    <div id="bgm-status-box">Track 1: Adventure</div>

    <div class="action-dock" id="main-dock">
        <button class="btn-action" title="업로드" onclick="triggerFileInput()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImage(event)">
        
        <button onclick="changeTrack()" class="btn-action" id="music-btn" title="배경음악 전환">
            <svg id="music-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>

        <button onclick="toggleSidebar()" class="btn-action" title="설정"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn-action" onclick="toggleMute()"><span id="sound-icon-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span></button>
    </div>

    <div class="status-pill">
        <div id="mood-emoji" class="text-2xl transition-all duration-300">😩</div>
        <div class="w-[1px] h-5 bg-white/20"></div>
        <div id="squish-counter" class="counter-val">0</div>
    </div>

    <div id="sidebar" class="sidebar-panel">
        <div class="sidebar-content shadow-2xl">
            <div class="w-12 h-1 bg-stone-100 rounded-full mx-auto mb-6"></div>
            <div class="space-y-6">
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between uppercase tracking-widest"><span>확대 정도</span><span id="zoom-val">1.0x</span></label>
                    <input type="range" id="zoom-slider" min="1.0" max="5.0" step="0.05" value="1.0">
                </div>
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-stone-400 flex justify-between uppercase tracking-widest"><span>상하 위치</span><span id="offset-val">0</span></label>
                    <input type="range" id="y-offset-slider" min="-1200" max="1200" step="1" value="0">
                </div>
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-stone-800 flex justify-between uppercase tracking-widest"><span>누름 강도</span><span id="strength-val">1.0x</span></label>
                    <input type="range" id="strength-slider" min="0.2" max="3.0" step="0.1" value="1.0">
                </div>
            </div>
            <button onclick="resetSettings()" class="w-full mt-8 py-3 bg-stone-50 text-stone-400 font-bold rounded-xl text-[11px]">RESET ALL</button>
            <button onclick="toggleSidebar()" class="w-full mt-3 py-3 bg-stone-800 text-white font-bold rounded-xl text-[11px]">CONFIRM</button>
        </div>
    </div>

    <main id="stage" class="relative w-full h-full flex items-center justify-center">
        <canvas id="mainCanvas"></canvas>
    </main>

    <script>
        const intro = document.getElementById('intro-screen');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const counterEl = document.getElementById('squish-counter');
        const emojiEl = document.getElementById('mood-emoji');
        const messageEl = document.getElementById('comfort-message');
        const sidebar = document.getElementById('sidebar');
        const fileInput = document.getElementById('file-input');
        const zoomSlider = document.getElementById('zoom-slider');
        const yOffsetSlider = document.getElementById('y-offset-slider');
        const strengthSlider = document.getElementById('strength-slider');
        const bgmStatus = document.getElementById('bgm-status-box');

        let width, height, ballSize, dollAspect = 1;
        let squishCount = 0, isMuted = false, isMusicActive = false, currentTrackIdx = 0;
        let userZoom = 1.0, imgYOffset = 0, squishStrength = 1.0, userImg = null, isPopped = false; 

        const meshRes = 18; 
        let mesh = [], cottonParticles = [], activeTouches = new Map();
        const moodSteps = ['😩','😟','😐','🙂','😊','🥰','🤩'];

        const catharticMessages = [
            "인생 참 엿같다, 그치?", "그 인간 면상이라 생각하고 꽉 눌러!", "지랄도 풍년이라더니 오늘이 딱이네.", "퇴사가 답인가...", "오늘 너 건드린 놈, 탈모 와라!",
            "다 때려치우고 싶다 진짜...", "아무것도 안 하고 싶다.", "세상은 넓고 미친놈은 더 많다.", "시X... 소리가 절로 나오네.", "적게 일하고 많이 벌게 해주세요.", 
            "돈 많은 백수가 꿈입니다.", "인간관계? 다 부질없다 주물러버려!", "웃어주니까 가마니로 보이나?", "참는 자에게 병이 온다.", "빡치면 팍팍 눌러, 내가 다 받아줄게.",
            "오늘도 무사히 넘겼네. 대단해.", "말 같지 않은 말은 씹는 게 상책.", "야근 시키는 놈 다 지옥 가라.", "인생 짧아, 화내지 말고 주물러.", "지갑도 텅, 마음도 텅."
        ];

        // --- 20가지 테마별 BGM ---
        const tracks = [
            { name: "Adventure", tempo: 0.2, melody: [523, 659, 783, 1046, 783, 659] },
            { name: "Chill Day", tempo: 0.4, melody: [349, 392, 440, 523, 440, 392] },
            { name: "Fast Beat", tempo: 0.12, melody: [523, 523, 659, 523, 783, 1046] },
            { name: "Deep Peace", tempo: 0.6, melody: [261, 329, 392, 329] },
            { name: "Hero Theme", tempo: 0.18, melody: [392, 392, 392, 311, 466, 392] },
            { name: "Galaxy", tempo: 0.2, melody: [1046, 987, 783, 880, 1046] },
            { name: "Spring", tempo: 0.22, melody: [523, 587, 659, 523, 698, 659] },
            { name: "Castle", tempo: 0.28, melody: [261, 311, 349, 311, 261] },
            { name: "Retro Wave", tempo: 0.2, melody: [261, 392, 523, 659, 523, 392, 261] },
            { name: "Lullaby", tempo: 0.7, melody: [523, 440, 392, 329] }
        ];

        // --- 오디오 엔진 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let nextNoteTime = 0, noteIndex = 0;

        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playBgmLoop() {
            if (!isMusicActive || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;
            const track = tracks[currentTrackIdx % tracks.length];
            if (now > nextNoteTime) {
                const freq = track.melody[noteIndex % track.melody.length];
                if (freq > 0) {
                    const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    osc.type = (currentTrackIdx % 3 === 0) ? 'square' : 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    g.gain.setValueAtTime(0.01, now); g.gain.exponentialRampToValueAtTime(0.001, now + track.tempo * 0.9);
                    osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(now + track.tempo * 0.9);
                }
                noteIndex++; nextNoteTime = now + track.tempo;
            }
            requestAnimationFrame(playBgmLoop);
        }

        function playAsmrSquish() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const thud = audioCtx.createOscillator(); const g = audioCtx.createGain();
            thud.type = 'sine'; thud.frequency.setValueAtTime(110 + Math.random()*40, now);
            thud.frequency.exponentialRampToValueAtTime(40, now + 0.12);
            g.gain.setValueAtTime(0.05 * squishStrength, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            thud.connect(g); g.connect(audioCtx.destination); thud.start(); thud.stop(now + 0.12);
        }

        function playPopSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.5);
        }

        // --- 솜 파티클 ---
        class Cotton {
            constructor(x, y) {
                this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 16; this.vy = (Math.random() - 1.2) * 20;
                this.size = Math.random() * 15 + 20; this.alpha = 1.0; this.angle = Math.random() * Math.PI * 2; this.rot = (Math.random() - 0.5) * 0.1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.4; this.vx *= 0.97; this.vy *= 0.97; this.alpha -= 0.006; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = 'white';
                for(let i=0; i<3; i++) { const ox = Math.cos(i*2.1)*(this.size/2.5); const oy = Math.sin(i*2.1)*(this.size/2.5); ctx.beginPath(); ctx.arc(ox, oy, this.size/2, 0, Math.PI*2); ctx.fill(); }
                ctx.restore();
            }
        }

        function triggerPop() {
            isPopped = true; playPopSound();
            const cx = width / 2; const cy = height / 2;
            for(let i=0; i<60; i++) cottonParticles.push(new Cotton(cx, cy));
            updateMessage("앗! 치료가 필요해요! 금방 고쳐줄게요 ✨", true);
            setTimeout(() => {
                isPopped = false; squishCount = 0;
                counterEl.innerText = "0"; emojiEl.innerText = moodSteps[0];
                updateMessage("다시 주물러보세요!", true);
            }, 4000);
        }

        // --- 인터랙션 로직 ---
        function triggerFileInput() { fileInput.click(); }
        function handleImage(e) { 
            const file = e.target.files[0]; 
            if (file) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    const img = new Image(); 
                    img.onload = () => { 
                        userImg = img; 
                        // 새로운 사진 로드 시 카운트 초기화
                        squishCount = 0;
                        counterEl.innerText = "0";
                        emojiEl.innerText = moodSteps[0];
                        resize(); 
                    }; 
                    img.src = ev.target.result; 
                }; 
                reader.readAsDataURL(file); 
            } 
        }

        const handleInteractionStart = (id, x, y) => {
            if (isPopped) return;
            initAudio();
            activeTouches.set(id, { x, y });
            if (!userImg) { triggerFileInput(); return; }
            
            const dx = Math.abs(x - width / 2);
            const dy = Math.abs(y - (height / 2 + imgYOffset));
            const hitW = ballSize * 0.5;
            const hitH = (ballSize * 0.5) / dollAspect;

            if (dx < hitW && dy < hitH) {
                squishCount++; counterEl.innerText = squishCount.toLocaleString();
                const stepIdx = Math.min(Math.floor(squishCount / 14.3), 6);
                if (emojiEl.innerText !== moodSteps[stepIdx]) { emojiEl.innerText = moodSteps[stepIdx]; emojiEl.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 250 }); }
                
                // 100번 터짐 체크
                if (squishCount >= 100) {
                    triggerPop();
                } else { 
                    playAsmrSquish(); 
                    updateMessage(); 
                }
            }
        };

        canvas.addEventListener('mousedown', (e) => handleInteractionStart('mouse', e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => { if (activeTouches.has('mouse')) activeTouches.set('mouse', { x: e.clientX, y: e.clientY }); });
        window.addEventListener('mouseup', () => activeTouches.delete('mouse'));
        canvas.addEventListener('touchstart', (e) => { 
            if (e.cancelable) e.preventDefault(); 
            initAudio();
            const t = e.changedTouches[0]; 
            if (!userImg) { triggerFileInput(); return; } 
            for (let i = 0; i < e.changedTouches.length; i++) handleInteractionStart(e.changedTouches[i].identifier, e.changedTouches[i].clientX, e.changedTouches[i].clientY); 
        }, { passive: false });
        window.addEventListener('touchmove', (e) => { for (let i = 0; i < e.changedTouches.length; i++) { const t = e.changedTouches[i]; if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY }); } }, { passive: true });
        window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) activeTouches.delete(e.changedTouches[i].identifier); });

        let lastMsgIdx = -1;
        function updateMessage(forceTxt) {
            let nextIdx; do { nextIdx = Math.floor(Math.random() * catharticMessages.length); } while (nextIdx === lastMsgIdx);
            lastMsgIdx = nextIdx; messageEl.classList.remove('show');
            setTimeout(() => {
                const displayTxt = forceTxt || catharticMessages[nextIdx];
                messageEl.children[0].innerText = displayTxt; messageEl.classList.add('show');
                if (!forceTxt) { setTimeout(() => { if (messageEl.children[0].innerText === displayTxt) messageEl.classList.remove('show'); }, 3000); }
            }, 50);
        }

        function resize() {
            width = window.innerWidth; height = window.innerHeight; 
            canvas.width = width * devicePixelRatio; canvas.height = height * devicePixelRatio; 
            canvas.style.width = width+'px'; canvas.style.height = height+'px'; 
            ctx.scale(devicePixelRatio, devicePixelRatio); 
            if (userImg) {
                dollAspect = userImg.width / userImg.height;
                const viewAspect = width / height;
                if (dollAspect > viewAspect) ballSize = width * 0.95 * userZoom;
                else ballSize = height * 0.85 * dollAspect * userZoom;
            } else { ballSize = Math.min(width, height) * 0.7; }
            initMesh();
        }
        function initMesh() { mesh = []; for (let r = 0; r <= meshRes; r++) for (let c = 0; c <= meshRes; c++) mesh.push({ ox: c/meshRes-0.5, oy: r/meshRes-0.5, cx: c/meshRes-0.5, cy: r/meshRes-0.5, vx: 0, vy: 0 }); }
        window.addEventListener('resize', resize); resize();

        function updatePhysics() {
            const cx = width/2, cy = height/2 + imgYOffset, maxD = 0.25;
            mesh.forEach(p => {
                p.vx += (p.ox - p.cx) * 0.22; p.vy += (p.oy - p.cy) * 0.22;
                activeTouches.forEach(pos => { 
                    const tx = (pos.x - (width/2))/ballSize, ty = (pos.y - cy)/(ballSize / dollAspect); 
                    const d = Math.sqrt((p.cx-tx)**2 + (p.cy-ty)**2); 
                    if (d < 0.25) { const s = (0.25 - d) * 2.8 * squishStrength; p.vx += (tx - p.cx) * s * 0.45; p.vy += (ty - p.cy) * s * 0.45; } 
                });
                p.vx *= 0.82; p.vy *= 0.82; p.cx += p.vx; p.cy += p.vy;
                const d = Math.sqrt((p.cx-p.ox)**2 + (p.cy-p.oy)**2); if (d > maxD) { const r = maxD/d; p.cx = p.ox + (p.cx-p.ox)*r; p.cy = p.oy + (p.cy-p.oy)*r; }
            });
            cottonParticles = cottonParticles.filter(c => c.alpha > 0); cottonParticles.forEach(c => c.update());
        }

        function drawTriangle(img, x0, y0, x1, y1, x2, y2, sx0, sy0, sx1, sy1, sx2, sy2) {
            ctx.save(); ctx.beginPath(); const cX = (x0+x1+x2)/3, cY = (y0+y1+y2)/3, fix = 1.3; ctx.moveTo(x0+(x0-cX)*(fix/100), y0+(y0-cY)*(fix/100)); ctx.lineTo(x1+(x1-cX)*(fix/100), y1+(y1-cY)*(fix/100)); ctx.lineTo(x2+(x2-cX)*(fix/100), y2+(y2-cY)*(fix/100)); ctx.closePath(); ctx.clip();
            const denom = sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1); if (Math.abs(denom) < 0.1) { ctx.restore(); return; }
            const m11 = (x0*(sy1-sy2)+x1*(sy2-sy0)+x2*(sy0-sy1))/denom, m12 = (y0*(sy1-sy2)+y1*(sy2-sy0)+y2*(sy0-sy1))/denom, m21 = (x0*(sx2-sx1)+x1*(sx0-sx2)+x2*(sx1-sx0))/denom, m22 = (y0*(sx2-sx1)+y1*(sx0-sx2)+y2*(sx1-sx0))/denom, dx = (x0*(sx1*sy2-sx2*sy1)+x1*(sx2*sy0-sx0*sy2)+x2*(sx0*sy1-sx1*sy0))/denom, dy = (y0*(sx1*sy2-sx2*sy1)+y1*(sx2*sy0-sx0*sy2)+y2*(sx0*sy1-sx1*sy0))/denom;
            ctx.setTransform(m11*devicePixelRatio, m12*devicePixelRatio, m21*devicePixelRatio, m22*devicePixelRatio, dx*devicePixelRatio, dy*devicePixelRatio); ctx.drawImage(img, 0, 0); ctx.restore();
        }

        function render() {
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, width, height); updatePhysics();
            const cx = width / 2, cy = height / 2 + imgYOffset, s = ballSize;
            if (userImg && !isPopped) {
                for (let r = 0; r < meshRes; r++) { 
                    for (let c = 0; c < meshRes; c++) { 
                        const i0 = r*(meshRes+1)+c, i1 = i0+1, i2 = i0+(meshRes+1), i3 = i2+1; 
                        const p0 = mesh[i0], p1 = mesh[i1], p2 = mesh[i2], p3 = mesh[i3]; 
                        const getSX = (p) => (p.ox + 0.5) * userImg.width; 
                        const getSY = (p) => (p.oy + 0.5) * userImg.height; 
                        drawTriangle(userImg, cx + p0.cx*s, cy + p0.cy*(s/dollAspect), cx + p1.cx*s, cy + p1.cy*(s/dollAspect), cx + p2.cx*s, cy + p2.cy*(s/dollAspect), getSX(p0), getSY(p0), getSX(p1), getSY(p1), getSX(p2), getSY(p2)); 
                        drawTriangle(userImg, cx + p1.cx*s, cy + p1.cy*(s/dollAspect), cx + p3.cx*s, cy + p3.cy*(s/dollAspect), cx + p2.cx*s, cy + p2.cy*(s/dollAspect), getSX(p1), getSY(p1), getSX(p3), getSY(p3), getSX(p2), getSY(p2)); 
                    } 
                }
                activeTouches.forEach(pos => { const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, ballSize*0.12 * squishStrength); g.addColorStop(0, 'rgba(255,255,255,0.1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fill(); });
            } else if (!userImg && !isPopped) { 
                ctx.beginPath(); ctx.arc(width/2, height/2, ballSize/4, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill(); 
                ctx.strokeStyle = '#DDD'; ctx.setLineDash([8, 8]); ctx.stroke(); ctx.fillStyle = '#AAA'; ctx.font = 'bold 13px Pretendard'; ctx.textAlign = 'center'; 
                ctx.fillText('인형을 올려주세요', width/2, height/2 + 5); 
            }
            cottonParticles.forEach(c => c.draw());
            requestAnimationFrame(render);
        }
        render();

        function startApp() { initAudio(); intro.classList.add('hidden'); isMusicActive = true; document.getElementById('music-btn').classList.add('music-active-status'); playBgmLoop(); showBgmStatus(); }
        function changeTrack() { initAudio(); if (!isMusicActive) { isMusicActive = true; document.getElementById('music-btn').classList.add('music-active-status'); playBgmLoop(); } else { currentTrackIdx = (currentTrackIdx + 1) % tracks.length; noteIndex = 0; } showBgmStatus(); }
        function showBgmStatus() { bgmStatus.innerText = `Track ${currentTrackIdx + 1}: ${tracks[currentTrackIdx % tracks.length].name}`; bgmStatus.style.opacity = "1"; setTimeout(() => { bgmStatus.style.opacity = "0"; }, 2500); }
        function toggleMute() { isMuted = !isMuted; isMusicActive = !isMuted; const mb = document.getElementById('music-btn'); if (isMuted) mb.classList.remove('music-active-status'); else { mb.classList.add('music-active-status'); playBgmLoop(); } document.getElementById('sound-icon-svg').innerHTML = isMuted ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'; }
        function toggleSidebar() { sidebar.classList.toggle('active'); }
        zoomSlider.oninput = (e) => { userZoom = parseFloat(e.target.value); document.getElementById('zoom-val').innerText = userZoom.toFixed(1) + "x"; resize(); };
        yOffsetSlider.oninput = (e) => { imgYOffset = parseInt(e.target.value); document.getElementById('offset-val').innerText = imgYOffset; };
        strengthSlider.oninput = (e) => { squishStrength = parseFloat(e.target.value); document.getElementById('strength-val').innerText = squishStrength.toFixed(1) + "x"; };
        function resetSettings() { userZoom = 1.0; imgYOffset = 0; squishStrength = 1.0; zoomSlider.value = 1.0; yOffsetSlider.value = 0; strengthSlider.value = 1.0; document.getElementById('zoom-val').innerText = "1.0x"; document.getElementById('offset-val').innerText = "0"; document.getElementById('strength-val').innerText = "1.0x"; resize(); }
    </script>
</body>
